name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: Vendor/ffmpeg
          key: ffmpeg-${{ hashFiles('Scripts/fetch-ffmpeg.sh') }}

      - name: Fetch ffmpeg
        run: test -x Vendor/ffmpeg || Scripts/fetch-ffmpeg.sh

      - name: Test
        run: |
          xcodebuild -project AnyFile.xcodeproj -scheme AnyFile -destination 'platform=macOS' \
            -derivedDataPath build/test test -quiet

      - name: Release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}$GITHUB_REF_NAME
          git log --no-merges --pretty='- %s' "$RANGE" > notes.md
          cat notes.md

      - name: Build DMG and appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "::error::Add the SPARKLE_PRIVATE_KEY repository secret"; exit 1; }
          Scripts/build-release.sh "${GITHUB_REF_NAME#v}" "$(git rev-list --count HEAD)" notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          {
            echo "## Install"
            echo "Download **AnyFile-$VERSION.dmg**, open it and drag AnyFile to Applications."
            echo "This build isn't notarized: the first time, macOS blocks it. Open **System Settings → Privacy & Security** and click **Open Anyway**. Later versions install through **AnyFile → Check for Updates…**."
            echo
            echo "## Changes"
            cat notes.md
          } > body.md
          gh release create "$GITHUB_REF_NAME" dist/AnyFile-$VERSION.dmg dist/appcast.xml \
            --title "AnyFile $VERSION" --notes-file body.md --verify-tag
